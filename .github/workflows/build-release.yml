name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --onefile --name AITokenTracker --add-data "effects/AI Token Tracker;effects/AI Token Tracker" bridge.py

      - name: Copy effect files and bundle assets
        shell: pwsh
        run: |
          Copy-Item -Path "effects" -Destination "dist" -Recurse -Force
          Copy-Item -Path "install.ps1", "install.bat", "setup.ps1", "setup.bat", "config.json", "README.md" -Destination "dist" -Force -ErrorAction SilentlyContinue

      - name: Create ZIP archive
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/*" -DestinationPath "AITokenTracker-windows.zip" -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: AITokenTracker-windows
          path: AITokenTracker-windows.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: AITokenTracker-windows.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
